name: CI

# Build plan definition of done (docs/BUILD-PLAN.md §1, item 3):
#   go build ./... && go vet ./... && go test ./... clean, and
#   GOOS=windows go build ./... clean (D-32 -- Windows must not silently rot).
#
# Two Go modules live in this repo (root github.com/shreyashsri79/openair, and
# oabench/ github.com/shreyashsri79/openair/oabench with its own go.mod), so
# every check below runs once per module rather than once for the whole tree.
#
# The desktop GUI is now inside the root module (D-87), so `go build ./...`
# covers it and the runner needs Fyne's system dependencies. It is excluded from
# one gate only: the Windows cross-build runs with CGO_ENABLED=0, and Fyne needs
# cgo on every platform, so that step builds everything except cmd/openair-gui.
# The Android APK is still out of scope -- it needs the SDK and an NDK.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so pushes to main don't queue stale CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt -l (must be empty)
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "gofmt -l found unformatted files:"
            echo "$files"
            echo
            echo "Run 'gofmt -w' on the files above."
            exit 1
          fi

  build-test:
    name: build/vet/test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            dir: .
          - name: oabench
            dir: oabench
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      # Fyne links against the host's OpenGL, X11 and Wayland headers. go-gl/glfw
      # compiles both display backends unless a build tag picks one, so both
      # sets are installed here and `go build ./...` needs no tags.
      - name: System dependencies for the desktop GUI
        if: matrix.name == 'root'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev \
            libxkbcommon-dev wayland-protocols

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./... (race-instrumented)
        # -race is affordable here: nothing in this matrix depends on wall-clock
        # network shaping (that lives in the netem workflow, gated separately).
        # If a future package's tests become too slow under -race, scope the
        # flag down to the other packages rather than dropping it repo-wide.
        run: go test -race ./...

      # cmd/openair-gui is skipped rather than cross-built: Fyne needs cgo, and a
      # Windows cgo toolchain on this runner is a heavier dependency than the
      # gate is worth. D-32 is about the network stack not rotting, and that is
      # what the remaining packages are.
      - name: GOOS=windows go build ./... (D-32)
        # The .GoFiles guard drops packages that hold only tests (internal/wire),
        # which `go build ./...` tolerates but an explicit package list does not.
        run: |
          pkgs=$(go list -f '{{if .GoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '/cmd/openair-gui$')
          GOOS=windows GOARCH=amd64 go build $pkgs
        env:
          CGO_ENABLED: 0
